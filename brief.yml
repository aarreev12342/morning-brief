name: Build morning brief

on:
  schedule:
    # Every 30 min from 06:30 to 22:30 IST (cron uses UTC). GitHub may start a few minutes late.
    - cron: '*/30 1-17 * * *'
  workflow_dispatch:        # lets you press "Run workflow" for an instant refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional
        run: python build_brief.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
