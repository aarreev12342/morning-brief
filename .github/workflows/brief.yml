name: Build morning brief

on:
  schedule:
    # Every 15 minutes from 06:00 to 23:45 IST (cron uses UTC). GitHub may start a few minutes late.
    - cron: '*/15 0-18 * * *'
  workflow_dispatch:        # "Run workflow" button for an instant refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # Keeps Gemini answers between runs so unchanged stories are not sent again.
      - uses: actions/cache@v4
        with:
          path: cache
          key: ai-cache-${{ github.run_id }}
          restore-keys: ai-cache-
      - name: Build the page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_brief.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
